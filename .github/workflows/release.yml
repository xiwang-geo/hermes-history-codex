name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skill
        run: |
          cd skills
          zip -r "../hermes-history-${GITHUB_REF_NAME}.zip" hermes-history

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-history-*.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
